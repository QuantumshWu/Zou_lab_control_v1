[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "zou-lab-control"
version = "0.1.0"
description = "Jupyter plotting frontend and neutral-atom control helpers for Zou lab experiments."
requires-python = ">=3.10"
dependencies = [
    "numpy",
]

[project.optional-dependencies]
analysis = [
    "scipy",
]
render = [
    "matplotlib",
]
qt = [
    "PyQt5",
    "PyQt5-Frameless-Window",
]
notebook = [
    "ipython",
    "ipykernel",
    "ipympl",
    "ipywidgets",
    "jupyterlab",
    "notebook",
    "scipy",
]
workbench = [
    "matplotlib",
    "PyQt5",
    "PyQt5-Frameless-Window",
    "scipy",
]
hardware = [
    "pyserial",
    "rpyc",
]
docs = [
    "nbclient",
    "nbconvert",
    "nbformat",
]

[tool.setuptools.packages.find]
include = ["Zou_lab_control*", "zlc_data*", "zlc_storage*", "zlc_pulse*", "zlc_neutral_atom*", "zlc_frontend*", "zlc_workbench*", "fpga*"]

[tool.setuptools.package-data]
"zlc_pulse" = ["assets/*.json"]
"zlc_neutral_atom" = ["assets/*.json"]
"zlc_frontend" = ["assets/*.ttf"]
"fpga" = ["board_config/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
